name: fix-cold-rnaseq-doi-site
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-cold-rnaseq-doi-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert publisher DOI/URL on cold RNA-seq entry
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/fix_site.py
          python3 /tmp/fix_site.py
      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-cold-rnaseq-doi-site.yml
          git add -A
          git status
          git commit -m "Add publisher DOI/URL to published cold RNA-seq BMC Research Notes entry"
          git push
