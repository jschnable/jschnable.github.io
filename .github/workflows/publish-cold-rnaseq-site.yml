name: publish-cold-rnaseq-site
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-cold-rnaseq-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch publications.yml to published DOI
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/site_patch.py
          python3 /tmp/site_patch.py
          grep -n 's13104-026-08007-x\|2026-h-rnaseq' _data/publications.yml | head -20
      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/publish-cold-rnaseq-site.yml
          rm -f .github/workflows/patch-cold-rnaseq-site.yml
          rm -f .github/workflows/upgrade-cold-rnaseq-published.yml
          rm -f scripts/_agent_tmp_upgrade_cold_rnaseq.py
          git add -A
          git status
          git commit -m "Upgrade cold RNA-seq BMC Research Notes entry to published DOI 10.1186/s13104-026-08007-x"
          git push
