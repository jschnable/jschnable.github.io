name: patch-disease-lab-authors
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/patch-disease-lab-authors.yml'
      - 'scripts/_agent_tmp_disease_lab_patch.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 scripts/_agent_tmp_disease_lab_patch.py
      - name: Commit and cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-disease-lab-authors.yml
          rm -f scripts/_agent_tmp_disease_lab_patch.py
          git add -A
          git status
          git commit -m "Bold Sofiya Arora and Karla Cuellar-Perez as lab authors on disease preprint"
          git push
